[package]
name = "chappie-desktop"
version = "0.1.0"
description = "Chappie AI 分身 IM 桌面客户端"
edition = "2021"

[lib]
name = "chappie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
