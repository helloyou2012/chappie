name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'training/**'
      - 'model/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chappie-production
  cancel-in-progress: false

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # 版本以 package.json 的 packageManager 字段为准，避免与 action 配置冲突
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          pnpm --filter @chappie/ai typecheck
          pnpm --filter @chappie/web typecheck
          pnpm --filter @chappie/mobile exec tsc --noEmit

      - name: Unit tests
        run: |
          pnpm test:contract
          pnpm test:shared
          cd ai && bun test

      - name: Build web
        # 自建部署可配置 vars.VITE_SERVER_URL / VITE_ADMIN_URL；
        # chappie.run 走同源反代，留空即回退 window.location.origin
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
        run: pnpm web:build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            classifier -> target

      - name: Rust format
        run: |
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          cargo fmt --manifest-path classifier/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml -p im-core-common -p im-core-chat

      - name: Build im-core (release)
        run: cargo build --release --manifest-path core/Cargo.toml -p im-core

      - name: Build classifier (release)
        run: cargo build --release --manifest-path classifier/Cargo.toml

      - name: Download classifier model artifacts
        env:
          MODEL_ARTIFACTS_URL: ${{ secrets.MODEL_ARTIFACTS_URL }}
        run: |
          test -n "$MODEL_ARTIFACTS_URL" || { echo "::error::MODEL_ARTIFACTS_URL 未配置：请上传 classifier-model.tar.gz 并设置 secret"; exit 1; }
          mkdir -p build/classifier/model
          curl -fL --retry 3 --retry-delay 3 "$MODEL_ARTIFACTS_URL" -o /tmp/classifier-model.tar.gz
          tar -xzf /tmp/classifier-model.tar.gz -C build/classifier/model
          if [ ! -f build/classifier/model/model.onnx ]; then
            found=$(find build/classifier/model -name model.onnx -type f | head -n 1)
            if [ -n "$found" ]; then cp -a "$(dirname "$found")"/. build/classifier/model/; fi
          fi
          test -f build/classifier/model/model.onnx
          test -f build/classifier/model/tokenizer.json
          test -f build/classifier/model/labels.json
          test -f build/classifier/model/margin.json

      - name: Bundle ai-platform
        run: |
          mkdir -p build/ai/dist
          cd ai
          bun build src/index.ts --target=bun --outdir=../build/ai/dist --minify
          bun build src/migrate.ts --target=bun --outdir=../build/ai/dist --minify
          cp -r migrations ../build/ai/migrations

      - name: Package deploy artifact
        run: |
          mkdir -p build/bin build/web build/classifier
          cp core/target/release/im-core build/bin/im-core
          cp classifier/target/release/chappie-classifier build/bin/chappie-classifier
          cp -r apps/web/dist/. build/web/
          cp deploy/remote-deploy.sh build/remote-deploy.sh
          cp deploy/chappie-classifier.service build/chappie-classifier.service
          tar -C build -czf chappie-deploy.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: chappie-deploy
          path: chappie-deploy.tar.gz
          retention-days: 14

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 注意：environment 级 secrets/vars 只在 job 启动后解析，不能在 job 级 if 中引用。
    # 这里用 step 级 env 引用，并在预检步骤给出明确错误。
    environment: deploy
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chappie-deploy

      - name: Preflight
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST 为空：请确认 environment 名称与 workflow 一致（deploy），且变量配置在该环境下"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY 为空：请在 deploy 环境添加 secret"; exit 1; }

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes chappie-deploy.tar.gz \
            "ubuntu@$DEPLOY_HOST:/tmp/chappie-deploy.tar.gz"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "ubuntu@$DEPLOY_HOST" \
            'rm -rf /tmp/chappie-deploy && mkdir -p /tmp/chappie-deploy && tar -xzf /tmp/chappie-deploy.tar.gz -C /tmp/chappie-deploy && bash /tmp/chappie-deploy/remote-deploy.sh'

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://chappie.run/' }}
        run: curl -fsS --retry 10 --retry-delay 2 -o /dev/null "$DEPLOY_URL"
